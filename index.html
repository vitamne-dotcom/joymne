<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>joymne</title>

  <!-- PWA настройки под iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: 40px 20px 30px 20px;
    }

    header {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #9ca3af;
      text-transform: lowercase;
    }

    .voice-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 100%;
    }

    .mic-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #181b20;
      border: 3px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
      transition: all 0.25s ease;
    }

    .mic-btn svg {
      width: 56px;
      height: 56px;
      fill: #3b82f6;
      transition: fill 0.2s ease;
    }

    body.recording .mic-btn {
      border-color: #ef4444;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.6);
      transform: scale(1.06);
    }

    body.recording .mic-btn svg {
      fill: #ef4444;
    }

    .status {
      margin-top: 24px;
      font-size: 1.15rem;
      color: #9ca3af;
      text-align: center;
      font-weight: 500;
    }

    .preview {
      margin-top: 12px;
      font-size: 1.15rem;
      color: #fff;
      text-align: center;
      min-height: 28px;
      max-width: 90%;
      font-weight: 600;
    }

    footer {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .manual-btn {
      background: none;
      border: none;
      color: #3b82f6;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      text-align: center;
    }

    .input-row {
      display: none;
      gap: 8px;
      background: #181b20;
      border: 1px solid #2a2e37;
      border-radius: 14px;
      padding: 6px 8px 6px 14px;
    }

    .input-row.open {
      display: flex;
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-row button {
      background: #3b82f6;
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #181b20;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container">
    <header>joymne</header>

    <div class="voice-box" id="voiceBox">
      <div class="mic-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <div class="status" id="status">Коснитесь для записи</div>
      <div class="preview" id="preview"></div>
    </div>

    <footer>
      <button class="manual-btn" id="toggleInput">Ввести вручную</button>
      <div class="input-row" id="inputRow">
        <input type="text" id="manualText" placeholder="например: такси 300 руб" />
        <button id="sendBtn">ОК</button>
      </div>
    </footer>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";

    const voiceBox = document.getElementById("voiceBox");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const toggleInput = document.getElementById("toggleInput");
    const inputRow = document.getElementById("inputRow");
    const manualText = document.getElementById("manualText");
    const sendBtn = document.getElementById("sendBtn");
    const toast = document.getElementById("toast");

    let isRecording = false;
    let recognition = null;
    let lastRecognizedText = "";
    let silenceTimer = null;
    let isTransitioning = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function destroyRecognition() {
      if (recognition) {
        recognition.onstart = null;
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try {
          recognition.abort();
        } catch (e) {}
        recognition = null;
      }
    }

    function resetUI() {
      isRecording = false;
      clearTimeout(silenceTimer);
      document.body.classList.remove("recording");
      status.innerText = "Коснитесь для записи";
    }

    function createRecognition() {
      if (!SpeechRecognition) return null;

      destroyRecognition();

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = "ru-RU";

      rec.onstart = () => {
        isRecording = true;
        isTransitioning = false;
        document.body.classList.add("recording");
        status.innerText = "Слушаю...";
      };

      rec.onresult = (e) => {
        let text = "";
        for (let i = 0; i < e.results.length; ++i) {
          text += e.results[i][0].transcript;
        }

        if (text.trim()) {
          lastRecognizedText = text.trim();
          preview.innerText = lastRecognizedText;

          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (isRecording) {
              stopAndSend();
            }
          }, 1400);
        }
      };

      rec.onerror = (e) => {
        console.warn("Speech error:", e.error);
        if (e.error !== "no-speech" && e.error !== "aborted") {
          showToast("Ошибка микрофона: " + e.error);
        }
        destroyRecognition();
        resetUI();
        isTransitioning = false;
      };

      rec.onend = () => {
        if (isRecording) {
          stopAndSend();
        } else {
          destroyRecognition();
          resetUI();
          isTransitioning = false;
        }
      };

      return rec;
    }

    function startListening() {
      if (!SpeechRecognition) {
        showToast("Голосовой ввод не поддерживается");
        return;
      }

      if (isTransitioning) return;
      isTransitioning = true;

      resetUI();
      preview.innerText = "";
      lastRecognizedText = "";
      status.innerText = "Запуск микрофона...";

      // Небольшая задержка перед стартом позволяет iOS полностью сбросить предыдущую аудиосессию
      setTimeout(() => {
        try {
          recognition = createRecognition();
          if (recognition) {
            recognition.start();
          }
        } catch (err) {
          console.warn("Recognition start failed:", err);
          destroyRecognition();
          resetUI();
          isTransitioning = false;
        }
      }, 250);
    }

    function stopAndSend() {
      const textToSend = lastRecognizedText;

      resetUI();
      destroyRecognition();

      if (textToSend && textToSend.length > 0) {
        sendTransaction(textToSend);
      }
    }

    voiceBox.addEventListener("click", () => {
      if (isRecording) {
        stopAndSend();
      } else {
        startListening();
      }
    });

    toggleInput.addEventListener("click", () => {
      inputRow.classList.toggle("open");
      if (inputRow.classList.contains("open")) {
        manualText.focus();
        toggleInput.innerText = "Скрыть";
      } else {
        toggleInput.innerText = "Ввести вручную";
      }
    });

    sendBtn.addEventListener("click", () => {
      const val = manualText.value.trim();
      if (val) {
        sendTransaction(val);
        manualText.value = "";
        inputRow.classList.remove("open");
        toggleInput.innerText = "Ввести вручную";
      }
    });

    manualText.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    async function sendTransaction(text) {
      status.innerText = "Сохранение...";
      showToast("Записываем: " + text);

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify({ text: text }),
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success") {
          const tx = data.transaction;
          showToast(`✓ ${tx.amount} ${tx.currency} — ${tx.category}`);
          status.innerText = "Сохранено!";
          setTimeout(() => {
            status.innerText = "Коснитесь для записи";
            preview.innerText = "";
          }, 2000);
        } else {
          showToast("Ошибка: " + (data.message || "Не удалось сохранить"));
          status.innerText = "Коснитесь для записи";
        }
      } catch (err) {
        console.error("Fetch error:", err);
        showToast("Ошибка соединения");
        status.innerText = "Коснитесь для записи";
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }
  </script>
</body>
</html>
