<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>joymne</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top) + 10px) 20px max(20px, env(safe-area-inset-bottom)) 20px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4b5563;
      text-transform: lowercase;
    }

    .sheet-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.1);
      padding: 5px 10px;
      border-radius: 10px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .wallets-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0;
    }

    .wallet-card {
      background: #181b20;
      border: 1px solid #2a2e37;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: center;
    }

    .wallet-name {
      font-size: 0.75rem;
      color: #9ca3af;
      font-weight: 500;
    }

    .wallet-balance {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .action-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: auto;
      margin-top: auto;
    }

    .section-title {
      font-size: 0.9rem;
      color: #9ca3af;
      text-align: center;
      font-weight: 500;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .cash-btn {
      background: #181b20;
      border: 2px solid #2a2e37;
      color: #fff;
      padding: 16px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    .cash-btn:active {
      transform: scale(0.96);
      border-color: #3b82f6;
    }

    .cash-btn.transit {
      grid-column: span 2;
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.1);
    }

    .cash-btn.debt {
      grid-column: span 2;
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
    }

    .input-box {
      width: 100%;
      background: #181b20;
      border: 1px solid #3b82f6;
      border-radius: 18px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .input-box.open {
      display: flex;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #3b82f6;
      font-weight: 600;
    }

    .close-input {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      background: #0d0f12;
      border: 1px solid #2a2e37;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-row button {
      background: #3b82f6;
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-btn {
      background: #2a2e37;
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #181b20;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container" id="appContainer">
    <div class="top-bar">
      <header>joymne</header>
      <a href="https://docs.google.com/spreadsheets/d/1CV7tLiYPKjXMrVszVIZI4bh5W0Ai3LpZfTyJVn4-8sY/edit" target="_blank" class="sheet-link" id="sheetLink">Таблица ↗</a>
    </div>

    <!-- Остатки касс -->
    <div class="wallets-grid" id="walletsGrid">
      <div class="wallet-card"><div class="wallet-name">Мила</div><div class="wallet-balance" id="bal-mila">...</div></div>
      <div class="wallet-card"><div class="wallet-name">Банк</div><div class="wallet-balance" id="bal-bank">...</div></div>
      <div class="wallet-card"><div class="wallet-name">Нал</div><div class="wallet-balance" id="bal-nal">...</div></div>
    </div>

    <!-- Кнопки выбора -->
    <div class="action-section" id="actionSection">
      <div class="section-title">Выберите кассу или действие:</div>
      <div class="buttons-grid">
        <button class="cash-btn" onclick="openInput('Мила')">Мила</button>
        <button class="cash-btn" onclick="openInput('Банк')">Банк</button>
        <button class="cash-btn" onclick="openInput('Нал')">Нал</button>
        <button class="cash-btn transit" onclick="openInput('Транзит')">Транзит (перевод)</button>
        <button class="cash-btn debt" onclick="openInput('Долги')">Долги (дать / вернуть)</button>
      </div>
    </div>

    <!-- Форма ввода -->
    <div class="input-box" id="inputBox">
      <div class="input-header">
        <span id="selectedActionTitle">Ввод</span>
        <button class="close-input" onclick="closeInput()">✕</button>
      </div>
      <div class="input-row">
        <input type="text" id="txInput" placeholder="Текст или сумма..." autocomplete="off" />
        <button id="sendBtn" onclick="submitTransaction()">ОК</button>
      </div>
      <label class="photo-btn">
        📷 Сфотографировать чек
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none;" onchange="handlePhoto(this)" />
      </label>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";
    const APP_VERSION = "18.0";

    if (localStorage.getItem("joymne_ver") !== APP_VERSION) {
      localStorage.setItem("joymne_ver", APP_VERSION);
      window.location.replace(window.location.pathname + "?v=" + Date.now());
    }

    let activeCategory = "";

    window.addEventListener("DOMContentLoaded", () => {
      loadBalances();
      const savedMsg = sessionStorage.getItem("joymne_toast");
      if (savedMsg) {
        sessionStorage.removeItem("joymne_toast");
        showToast(savedMsg);
      }
    });

    async function loadBalances() {
      try {
        const res = await fetch(APPS_SCRIPT_URL + "?action=getBalances");
        const data = await res.json();
        if (data.status === "success") {
          document.getElementById("bal-mila").innerText = (data.balances.Мила || 0) + " €";
          document.getElementById("bal-bank").innerText = (data.balances.Банк || 0) + " €";
          document.getElementById("bal-nal").innerText = (data.balances.Нал || 0) + " €";
        }
      } catch (e) {}
    }

    function openInput(category) {
      activeCategory = category;
      document.getElementById("selectedActionTitle").innerText = category === 'Транзит' ? 'Транзит (с Милы на Банк 100)' : (category === 'Долги' ? 'Долги (дал/вернул)' : 'Касса: ' + category);
      document.getElementById("actionSection").style.display = "none";
      document.getElementById("inputBox").classList.add("open");
      
      const input = document.getElementById("txInput");
      input.value = "";
      input.focus();
    }

    function closeInput() {
      document.getElementById("inputBox").classList.remove("open");
      document.getElementById("actionSection").style.display = "flex";
    }

    async function submitTransaction(photoBase64 = null) {
      const text = document.getElementById("txInput").value.trim();
      if (!text && !photoBase64) return;

      closeInput();
      showToast("Сохранение и анализ...");

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ category: activeCategory, text: text, photo: photoBase64 }),
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success") {
          sessionStorage.setItem("joymne_toast", "✓ Сохранено успешно!");
          window.location.replace(window.location.pathname + "?t=" + Date.now());
        } else {
          showToast("Ошибка: " + (data.message || "Не удалось сохранить"));
        }
      } catch (err) {
        showToast("Ошибка соединения");
      }
    }

    function handlePhoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          submitTransaction(e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById("txInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitTransaction();
    });

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => { toast.classList.remove("show"); }, 3000);
    }
  </script>
</body>
</html>
