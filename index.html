<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>joymne</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* Главный контейнер: прижимает всё к самому низу экрана */
    .app-container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 20px 20px 55px 20px;
      transition: padding-bottom 0.25s ease;
    }

    /* Когда открыта клавиатура — поднимаем в центр над клавиатурой */
    body.listening .app-container {
      justify-content: center;
      padding-bottom: 10px;
    }

    header {
      position: absolute;
      top: 28px;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #374151;
      text-transform: lowercase;
    }

    .floating-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      cursor: pointer;
    }

    /* Парящий распознанный текст прямо на фоне без рамок */
    .preview {
      margin-bottom: 28px;
      font-size: 1.45rem;
      color: #ffffff;
      text-align: center;
      min-height: 36px;
      max-width: 90%;
      font-weight: 600;
      line-height: 1.35;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .mic-btn {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: #14171c;
      border: 3px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.35);
      transition: all 0.25s ease;
    }

    .mic-btn svg {
      width: 50px;
      height: 50px;
      fill: #3b82f6;
      transition: fill 0.25s ease;
      pointer-events: none;
    }

    /* Невидимый инпут внутри самой круглой кнопки */
    #hiddenInput {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      caret-color: transparent;
      font-size: 16px;
      cursor: pointer;
    }

    body.listening .mic-btn {
      border-color: #ef4444;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.55);
      transform: scale(1.06);
    }

    body.listening .mic-btn svg {
      fill: #ef4444;
    }

    body.saved .mic-btn {
      border-color: #10b981;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.55);
    }

    body.saved .mic-btn svg {
      fill: #10b981;
    }

    /* Парящая подпись под кнопкой */
    .status {
      margin-top: 20px;
      font-size: 1rem;
      color: #6b7280;
      text-align: center;
      font-weight: 500;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(24, 27, 32, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #2a2e37;
      color: #fff;
      padding: 12px 22px;
      border-radius: 24px;
      font-size: 0.95rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container" id="appContainer">
    <header>joymne</header>

    <label for="hiddenInput" class="floating-zone">
      <div class="preview" id="preview"></div>
      <div class="mic-btn">
        <input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" enterkeyhint="send" />
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <div class="status" id="status">Коснитесь для записи</div>
    </label>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";
    const APP_VERSION = "3.0";

    // Принудительный сброс старого кеша iOS PWA
    if (localStorage.getItem("joymne_ver") !== APP_VERSION) {
      localStorage.setItem("joymne_ver", APP_VERSION);
      window.location.replace(window.location.pathname + "?v=" + Date.now());
    }

    const appContainer = document.getElementById("appContainer");
    const hiddenInput = document.getElementById("hiddenInput");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const toast = document.getElementById("toast");

    let autoSendTimer = null;
    let isSending = false;

    function adjustViewport() {
      if (window.visualViewport) {
        appContainer.style.height = window.visualViewport.height + "px";
        window.scrollTo(0, 0);
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", adjustViewport);
      window.visualViewport.addEventListener("scroll", adjustViewport);
    }

    hiddenInput.addEventListener("focus", () => {
      document.body.classList.remove("saved");
      document.body.classList.add("listening");
      status.innerText = "Слушаю...";
      adjustViewport();
    });

    hiddenInput.addEventListener("blur", () => {
      document.body.classList.remove("listening");
      appContainer.style.height = "100%";
      if (!hiddenInput.value.trim() && !isSending) {
        status.innerText = "Коснитесь для записи";
      }
    });

    hiddenInput.addEventListener("input", () => {
      const val = hiddenInput.value.trim();
      preview.innerText = val;
      clearTimeout(autoSendTimer);

      if (val.length > 0) {
        status.innerText = "Записываю...";
        autoSendTimer = setTimeout(() => {
          triggerSend();
        }, 1800);
      } else {
        status.innerText = "Слушаю...";
      }
    });

    hiddenInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(autoSendTimer);
        triggerSend();
      }
    });

    function triggerSend() {
      const text = hiddenInput.value.trim();
      if (!text || isSending) return;

      hiddenInput.value = "";
      sendTransaction(text);
    }

    async function sendTransaction(text) {
      isSending = true;
      document.body.classList.remove("listening");
      status.innerText = "Сохранение...";

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify({ text: text }),
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success") {
          const tx = data.transaction;
          document.body.classList.add("saved");
          showToast(`✓ ${tx.amount} ${tx.currency} — ${tx.category}`);
          status.innerText = "Сохранено!";

          setTimeout(() => {
            document.body.classList.remove("saved");
            preview.innerText = "";
            if (document.activeElement === hiddenInput) {
              document.body.classList.add("listening");
              status.innerText = "Слушаю...";
            } else {
              status.innerText = "Коснитесь для записи";
            }
          }, 1600);
        } else {
          showToast("Ошибка: " + (data.message || "Не удалось сохранить"));
          status.innerText = "Коснитесь для записи";
        }
      } catch (err) {
        showToast("Ошибка соединения");
        status.innerText = "Коснитесь для записи";
      } finally {
        isSending = false;
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }
  </script>
</body>
</html>
