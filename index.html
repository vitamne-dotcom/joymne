<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>joymne</title>

  <!-- PWA настройки под iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      cursor: pointer;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100%;
      padding: 40px 20px 20px 20px;
      gap: 24px;
    }

    header {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #9ca3af;
      text-transform: lowercase;
    }

    .voice-card {
      width: 100%;
      max-width: 380px;
      background: #181b20;
      border: 2px solid #2a2e37;
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s ease;
    }

    .voice-card.active {
      border-color: #10b981;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.2);
    }

    .mic-btn {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #0d0f12;
      border: 3px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.35);
      transition: all 0.25s ease;
      margin-bottom: 14px;
    }

    .mic-btn svg {
      width: 38px;
      height: 38px;
      fill: #3b82f6;
      transition: fill 0.2s ease;
    }

    .voice-card.active .mic-btn {
      border-color: #10b981;
      box-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
      transform: scale(1.05);
    }

    .voice-card.active .mic-btn svg {
      fill: #10b981;
    }

    .status {
      font-size: 1rem;
      color: #9ca3af;
      text-align: center;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .dictation-input {
      width: 100%;
      background: #0d0f12;
      border: 1px solid #2a2e37;
      border-radius: 14px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }

    .dictation-input:focus {
      border-color: #10b981;
    }

    .dictation-input::placeholder {
      color: #6b7280;
      font-weight: 400;
      font-size: 0.95rem;
    }

    .send-now-btn {
      margin-top: 14px;
      width: 100%;
      background: #10b981;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .send-now-btn.visible {
      display: block;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #181b20;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container" id="appContainer">
    <header>joymne</header>

    <div class="voice-card" id="voiceCard">
      <div class="mic-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <div class="status" id="status">Коснитесь любого места экрана 👇</div>
      <input 
        type="text" 
        id="dictationInput" 
        class="dictation-input" 
        placeholder="Нажмите 🎙️ на клавиатуре" 
        autocomplete="off"
        autofocus
        enterkeyhint="send"
      />
      <button id="sendNowBtn" class="send-now-btn">Отправить сейчас</button>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";

    const voiceCard = document.getElementById("voiceCard");
    const status = document.getElementById("status");
    const dictationInput = document.getElementById("dictationInput");
    const sendNowBtn = document.getElementById("sendNowBtn");
    const toast = document.getElementById("toast");

    let autoSendTimer = null;
    let isSending = false;

    // Пробуем открыть сразу (сработает на десктопе/Android)
    window.addEventListener("load", () => {
      dictationInput.focus();
    });

    // На iOS любое первое касание в любую точку экрана мгновенно поднимает клавиатуру
    document.body.addEventListener("touchstart", (e) => {
      if (e.target !== sendNowBtn && document.activeElement !== dictationInput) {
        dictationInput.focus();
      }
    }, { passive: true });

    document.body.addEventListener("click", (e) => {
      if (e.target !== sendNowBtn) {
        dictationInput.focus();
      }
    });

    dictationInput.addEventListener("focus", () => {
      voiceCard.classList.add("active");
      status.innerText = "Нажмите 🎙️ внизу клавиатуры и говорите";
    });

    dictationInput.addEventListener("blur", () => {
      voiceCard.classList.remove("active");
      if (!dictationInput.value.trim()) {
        status.innerText = "Коснитесь любого места экрана 👇";
      }
    });

    // Автоматическая отправка после паузы в речи
    dictationInput.addEventListener("input", () => {
      const val = dictationInput.value.trim();
      clearTimeout(autoSendTimer);

      if (val.length > 0) {
        sendNowBtn.classList.add("visible");
        status.innerText = "Авто-сохранение через 2 сек...";

        autoSendTimer = setTimeout(() => {
          triggerSend();
        }, 2000);
      } else {
        sendNowBtn.classList.remove("visible");
        status.innerText = "Нажмите 🎙️ внизу клавиатуры и говорите";
      }
    });

    dictationInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(autoSendTimer);
        triggerSend();
      }
    });

    sendNowBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      clearTimeout(autoSendTimer);
      triggerSend();
    });

    function triggerSend() {
      const text = dictationInput.value.trim();
      if (!text || isSending) return;

      // Очищаем поле, но НЕ закрываем клавиатуру (фокус остается!)
      dictationInput.value = "";
      sendNowBtn.classList.remove("visible");
      dictationInput.focus();
      sendTransaction(text);
    }

    async function sendTransaction(text) {
      isSending = true;
      status.innerText = "Сохранение...";
      showToast("Записываем: " + text);

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify({ text: text }),
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success") {
          const tx = data.transaction;
          showToast(`✓ ${tx.amount} ${tx.currency} — ${tx.category}`);
          status.innerText = "Сохранено! Говорите следующую запись 🎙️";
        } else {
          showToast("Ошибка: " + (data.message || "Не удалось сохранить"));
          status.innerText = "Попробуйте еще раз";
        }
      } catch (err) {
        console.error("Fetch error:", err);
        showToast("Ошибка соединения");
        status.innerText = "Попробуйте еще раз";
      } finally {
        isSending = false;
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }
  </script>
</body>
</html>
