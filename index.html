<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>joymne</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top) + 10px) 20px max(20px, env(safe-area-inset-bottom)) 20px;
      transition: height 0.15s ease-out;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    header {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4b5563;
      text-transform: lowercase;
    }

    /* Нижняя панель управления */
    .bottom-panel {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    /* Ряд 1: Транзит и Долги (2 круга) */
    .actions-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .action-circle-btn {
      background: #181b20;
      border: 2px solid #2a2e37;
      border-radius: 20px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
      text-align: center;
    }

    .action-circle-btn:active {
      transform: scale(0.96);
      border-color: #3b82f6;
    }

    .action-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .action-sub {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 2px;
    }

    /* Ряд 2: 3 круглые кнопки касс (Мила, Банк, Нал) */
    .wallets-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .wallet-circle-btn {
      background: #181b20;
      border: 2px solid #2a2e37;
      border-radius: 24px;
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
      text-align: center;
      min-height: 85px;
    }

    .wallet-circle-btn:active {
      transform: scale(0.96);
      border-color: #3b82f6;
    }

    .wallet-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .wallet-amount {
      font-size: 0.8rem;
      font-weight: 600;
      color: #3b82f6;
      margin-top: 4px;
    }

    /* Модальное окно ввода */
    .input-box {
      width: 100%;
      background: #181b20;
      border: 1px solid #3b82f6;
      border-radius: 18px;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .input-box.open {
      display: flex;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #3b82f6;
      font-weight: 600;
    }

    .close-input {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      background: #0d0f12;
      border: 1px solid #2a2e37;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-row button {
      background: #3b82f6;
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-btn {
      background: #2a2e37;
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #181b20;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container" id="appContainer">
    <div class="top-bar">
      <header>joymne</header>
    </div>

    <div style="margin: auto 0; text-align: center; color: #4b5563; font-size: 0.95rem;">
      Выберите действие внизу 👇
    </div>

    <!-- Нижняя панель с кнопками -->
    <div class="bottom-panel" id="bottomPanel">
      
      <!-- Форма ввода (появляется при клике) -->
      <div class="input-box" id="inputBox">
        <div class="input-header">
          <span id="selectedActionTitle">Ввод</span>
          <button class="close-input" onclick="closeInput()">✕</button>
        </div>
        <div class="input-row">
          <input type="text" id="txInput" placeholder="Текст или сумма (используйте 🎤)" autocomplete="off" />
          <button id="sendBtn" onclick="submitTransaction()">ОК</button>
        </div>
        <label class="photo-btn">
          📷 Сфотографировать чек
          <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none;" onchange="handlePhoto(this)" />
        </label>
      </div>

      <!-- Кнопки действий и касс -->
      <div id="buttonsSection" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- Ряд 1: Транзит и Долги -->
        <div class="actions-row">
          <div class="action-circle-btn" onclick="openInput('Транзит')">
            <div class="action-title">Транзит</div>
            <div class="action-sub" id="sub-transit">перевод</div>
          </div>
          <div class="action-circle-btn" onclick="openInput('Долги')">
            <div class="action-title">Долги</div>
            <div class="action-sub" id="sub-debt">учет</div>
          </div>
        </div>

        <!-- Ряд 2: Мила, Банк, Нал -->
        <div class="wallets-row">
          <div class="wallet-circle-btn" onclick="openInput('Мила')">
            <div class="wallet-title">Мила</div>
            <div class="wallet-amount" id="bal-mila">...</div>
          </div>
          <div class="wallet-circle-btn" onclick="openInput('Банк')">
            <div class="wallet-title">Банк</div>
            <div class="wallet-amount" id="bal-bank">...</div>
          </div>
          <div class="wallet-circle-btn" onclick="openInput('Нал')">
            <div class="wallet-title">Нал</div>
            <div class="wallet-amount" id="bal-nal">...</div>
          </div>
        </div>
      </div>

    </div>
  </div>

      updateViewport();
