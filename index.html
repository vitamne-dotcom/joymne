<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>joymne</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top) + 10px) 16px max(24px, env(safe-area-inset-bottom)) 16px;
      transition: height 0.15s ease-out;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    header {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4b5563;
      text-transform: lowercase;
    }

    .bottom-panel {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
      align-items: center;
    }

    .circle-btn {
      width: 100px;
      height: 100px;
      background: #181b20;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      padding: 10px;
    }

    .circle-btn:active {
      transform: scale(0.95);
    }

    .total-gold-btn {
      border: 2.5px solid #eab308;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.25);
      margin-bottom: 4px;
    }

    .gold-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #eab308;
    }

    .gold-amount {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      margin-top: 3px;
    }

    .actions-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .btn-debt { border: 2.5px solid #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.25); }
    .btn-transit { border: 2.5px solid #6b7280; box-shadow: 0 0 20px rgba(107, 114, 128, 0.2); }

    .action-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .action-sub {
      font-size: 0.7rem;
      font-weight: 600;
      color: #9ca3af;
      margin-top: 2px;
    }

    .wallets-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    .wallet-mila { border: 2.5px solid #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.25); }
    .wallet-bank { border: 2.5px solid #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.25); }
    .wallet-hands { border: 2.5px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }

    .wallet-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .wallet-amount {
      font-size: 0.75rem;
      font-weight: 600;
      color: #d1d5db;
      margin-top: 3px;
    }

    .input-box {
      width: 100%;
      background: #181b20;
      border: 1px solid #3b82f6;
      border-radius: 20px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .input-box.open {
      display: flex;
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #3b82f6;
      font-weight: 600;
    }

    .close-input {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0 5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      background: #0d0f12;
      border: 1px solid #2a2e37;
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-row button {
      background: #3b82f6;
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 0 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-btn {
      background: #2a2e37;
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #181b20;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container" id="appContainer">
    <div class="top-bar">
      <header>joymne</header>
    </div>

    <div style="margin: auto 0; text-align: center; color: #4b5563; font-size: 0.95rem;">
      Выберите действие внизу 👇
    </div>

    <div class="bottom-panel" id="bottomPanel">
      
      <div class="input-box" id="inputBox">
        <div class="input-header">
          <span id="selectedActionTitle">Ввод</span>
          <button class="close-input" onclick="closeInput()">✕</button>
        </div>
        <div class="input-row">
          <input type="text" id="txInput" placeholder="например: -50 или 50" autocomplete="off" />
          <button id="sendBtn" onclick="submitTransaction()">ОК</button>
        </div>
        <label class="photo-btn" id="photoLabel">
          📷 Сфотографировать чек
          <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none;" onchange="handlePhoto(this)" />
        </label>
      </div>

      <div id="buttonsSection" style="display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%;">
        
        <div class="circle-btn total-gold-btn" onclick="toggleBalances()">
          <div class="gold-title">Joy</div>
          <div class="gold-amount" id="total-gold-amount">---</div>
        </div>

        <div class="actions-row">
          <div class="circle-btn btn-debt" onclick="openInput('Долги')">
            <div class="action-title">Долги</div>
            <div class="action-sub" id="sub-debt">---</div>
          </div>
          <div class="circle-btn btn-transit" onclick="openInput('Транзит')">
            <div class="action-title">Транзит</div>
            <div class="action-sub" id="sub-transit">---</div>
          </div>
        </div>

        <div class="wallets-row">
          <div class="circle-btn wallet-mila" onclick="openInput('Мила')">
            <div class="wallet-title">Мила</div>
            <div class="wallet-amount" id="bal-mila">---</div>
          </div>
          <div class="circle-btn wallet-bank" onclick="openInput('Банк')">
            <div class="wallet-title">Банк</div>
            <div class="wallet-amount" id="bal-bank">---</div>
          </div>
          <div class="circle-btn wallet-hands" onclick="openInput('Руки')">
            <div class="wallet-title">Руки</div>
            <div class="wallet-amount" id="bal-hands">---</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";
    const APP_VERSION = "31.0";

    if (localStorage.getItem("joymne_ver") !== APP_VERSION) {
      localStorage.setItem("joymne_ver", APP_VERSION);
      window.location.replace(window.location.pathname + "?v=" + Date.now());
    }

    let activeCategory = "";
    let cachedBalances = {};
    let areBalancesVisible = false;

    function updateViewport() {
      if (window.visualViewport) {
        document.getElementById("appContainer").style.height = window.visualViewport.height + "px";
        window.scrollTo(0, 0);
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateViewport);
      window.visualViewport.addEventListener("scroll", updateViewport);
      updateViewport();
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedMsg = sessionStorage.getItem("joymne_toast");
      if (savedMsg) {
        sessionStorage.removeItem("joymne_toast");
        showToast(savedMsg);
      }
    });

    async function toggleBalances() {
      if (areBalancesVisible) {
        areBalancesVisible = false;
        document.getElementById("bal-mila").innerText = "---";
        document.getElementById("bal-bank").innerText = "---";
        document.getElementById("bal-hands").innerText = "---";
        document.getElementById("sub-debt").innerText = "---";
        document.getElementById("sub-debt").style.color = "#9ca3af";
        document.getElementById("sub-transit").innerText = "---";
        document.getElementById("total-gold-amount").innerText = "---";
      } else {
        showToast("Загрузка балансов...");
        try {
          const res = await fetch(APPS_SCRIPT_URL + "?action=getBalances");
          const data = await res.json();
          if (data.status === "success") {
            cachedBalances = data.balances;
            areBalancesVisible = true;
            
            document.getElementById("bal-mila").innerText = Number(cachedBalances.Мила || 0).toFixed(2) + " €";
            document.getElementById("bal-bank").innerText = Number(cachedBalances.Банк || 0).toFixed(2) + " €";
            document.getElementById("bal-hands").innerText = Number(cachedBalances.Руки || 0).toFixed(2) + " €";
            
            const debtVal = cachedBalances.Долги || 0;
            const debtEl = document.getElementById("sub-debt");
            debtEl.innerText = (debtVal > 0 ? "+" : "") + Number(debtVal).toFixed(2) + " €";
            debtEl.style.color = debtVal < 0 ? "#ef4444" : (debtVal > 0 ? "#10b981" : "#9ca3af");

            const transitVal = cachedBalances.Транзит || 0;
            document.getElementById("sub-transit").innerText = Number(transitVal).toFixed(2) + " €";

            const totalNet = (cachedBalances.Мила || 0) + 
                             (cachedBalances.Банк || 0) + 
                             (cachedBalances.Руки || 0) + 
                             transitVal + 
                             debtVal;
            document.getElementById("total-gold-amount").innerText = Number(totalNet).toFixed(2) + " €";
          }
        } catch (e) {
          showToast("Ошибка загрузки");
        }
      }
    }

    function openInput(category) {
      activeCategory = category;
      document.getElementById("selectedActionTitle").innerText = category === 'Транзит' ? 'Транзит (напр: -50 копилка или 100 Мила->Банк)' : (category === 'Долги' ? 'Долги (-50 должен, 50 мне)' : 'Касса: ' + category);
      document.getElementById("buttonsSection").style.display = "none";
      document.getElementById("inputBox").classList.add("open");
      
      document.getElementById("photoLabel").style.display = (category === 'Долги' || category === 'Транзит') ? 'none' : 'block';

      const input = document.getElementById("txInput");
      input.value = "";
      input.focus();
    }

    function closeInput() {
      document.getElementById("inputBox").classList.remove("open");
      document.getElementById("buttonsSection").style.display = "flex";
    }

    async function submitTransaction(photoBase64 = null) {
      const text = document.getElementById("txInput").value.trim();
      if (!text && !photoBase64) return;

      closeInput();
      showToast("Обработка...");

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ category: activeCategory, text: text, photo: photoBase64 }),
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success") {
          sessionStorage.setItem("joymne_toast", "✓ Сохранено успешно!");
          window.location.replace(window.location.pathname + "?t=" + Date.now());
        } else {
          showToast("Ошибка: " + (data.message || "Не удалось сохранить"));
        }
      } catch (err) {
        showToast("Ошибка соединения");
      }
    }

    function handlePhoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          submitTransaction(e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    document.getElementById("txInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitTransaction();
    });

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => { toast.classList.remove("show"); }, 3500);
    }
  </script>
</body>
</html>
