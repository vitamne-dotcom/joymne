<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>joymne</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="joymne" />
  <meta name="theme-color" content="#0d0f12" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0d0f12;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    .app-container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 36px 20px 30px 20px;
    }

    header {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4b5563;
      text-transform: lowercase;
    }

    .voice-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      cursor: pointer;
      margin-top: auto;
      margin-bottom: auto;
    }

    .preview {
      margin-bottom: 24px;
      font-size: 1.35rem;
      color: #ffffff;
      text-align: center;
      min-height: 34px;
      max-width: 90%;
      font-weight: 600;
      line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #181b20;
      border: 3px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(59, 130, 246, 0.4);
      transition: all 0.25s ease;
    }

    .mic-btn svg {
      width: 52px;
      height: 52px;
      fill: #3b82f6;
      transition: fill 0.25s ease;
      pointer-events: none;
    }

    body.recording .mic-btn {
      border-color: #ef4444;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.6);
      transform: scale(1.05);
    }

    body.recording .mic-btn svg {
      fill: #ef4444;
    }

    body.saved .mic-btn {
      border-color: #10b981;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.6);
    }

    body.saved .mic-btn svg {
      fill: #10b981;
    }

    .status {
      margin-top: 18px;
      font-size: 1.05rem;
      color: #9ca3af;
      text-align: center;
      font-weight: 500;
    }

    footer {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .manual-btn {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 8px;
      cursor: pointer;
      text-align: center;
    }

    .input-row {
      display: none;
      gap: 8px;
      background: #181b20;
      border: 1px solid #2a2e37;
      border-radius: 14px;
      padding: 6px 8px 6px 14px;
    }

    .input-row.open {
      display: flex;
    }

    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 1rem;
      user-select: text;
      -webkit-user-select: text;
    }

    .input-row button {
      background: #3b82f6;
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #181b20;
      border: 1px solid #374151;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="toast" class="toast"></div>

  <div class="app-container">
    <header>joymne</header>

    <div class="voice-box" id="voiceBox">
      <div class="preview" id="preview"></div>
      <div class="mic-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </div>
      <div class="status" id="status">Коснитесь для записи</div>
    </div>

    <footer>
      <button class="manual-btn" id="toggleInput">Ввести вручную</button>
      <div class="input-row" id="inputRow">
        <input type="text" id="manualText" placeholder="например: такси 300 руб" />
        <button id="sendBtn">ОК</button>
      </div>
    </footer>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyouTYwZVPHbgb1jF7JoRmTIqW7novwK4hcwWCqlKDBq-4ExUp4gqx5deF5V0IiPJc7Dg/exec";
    const APP_VERSION = "8.0";

    if (localStorage.getItem("joymne_ver") !== APP_VERSION) {
      localStorage.setItem("joymne_ver", APP_VERSION);
      window.location.replace(window.location.pathname + "?v=" + Date.now());
    }

    const voiceBox = document.getElementById("voiceBox");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");
    const toggleInput = document.getElementById("toggleInput");
    const inputRow = document.getElementById("inputRow");
    const manualText = document.getElementById("manualText");
    const sendBtn = document.getElementById("sendBtn");
    const toast = document.getElementById("toast");

    let isRecording = false;
    let recognition = null;
    let currentTranscript = "";
    let silenceTimer = null;

    window.addEventListener("DOMContentLoaded", () => {
      const savedMsg = sessionStorage.getItem("joymne_toast");
      if (savedMsg) {
        sessionStorage.removeItem("joymne_toast");
        document.body.classList.add("saved");
        showToast(savedMsg);
        status.innerText = "Сохранено!";
        setTimeout(() => {
          document.body.classList.remove("saved");
          status.innerText = "Коснитесь для записи";
        }, 2000);
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function killRecognition() {
      if (recognition) {
        recognition.onstart = null;
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.abort(); } catch (e) {}
        recognition = null;
      }
    }

    function startListening() {
      if (!SpeechRecognition) {
        showToast("Голосовой ввод не поддерживается");
        return;
      }

      killRecognition();
      clearTimeout(silenceTimer);
      currentTranscript = "";
      preview.innerText = "";

      recognition = new SpeechRecognition();
      recognition.lang = "ru-RU";
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        document.body.classList.remove("saved");
        document.body.classList.add("recording");
        status.innerText = "Слушаю...";
      };

      recognition.onresult = (e) => {
        let text = "";
        for (let i = 0; i < e.results.length; ++i) {
          text += e.results[i][0].transcript;
        }
        currentTranscript = text.trim();
        preview.innerText = currentTranscript;

        clearTimeout(silenceTimer);
        if (currentTranscript) {
          silenceTimer = setTimeout(() => {
            if (isRecording && recognition) {
              try { recognition.stop(); } catch (err) {}
            }
          }, 1400);
        }
      };

      recognition.onerror = (e) => {
        clearTimeout(silenceTimer);
        isRecording = false;
        killRecognition();
        document.body.classList.remove("recording");
        status.innerText = "Коснитесь для записи";
        if (e.error !== "no-speech" && e.error !== "aborted") {
          showToast("Ошибка микрофона: " + e.error);
        }
      };

      recognition.onend = () => {
        clearTimeout(silenceTimer);
        isRecording = false;
        document.body.classList.remove("recording");
        status.innerText = "Коснитесь для записи";

        const finalToSend = currentTranscript;
        currentTranscript = "";
        killRecognition();

        if (finalToSend) {
          sendTransaction(finalToSend);
        }
      };

      try {
        recognition.start();
      } catch (err) {
        killRecognition();
        window.location.replace(window.location.pathname + "?t=" + Date.now());
      }
    }

    voiceBox.addEventListener("click", () => {
      if (isRecording) {
        clearTimeout(silenceTimer);
        killRecognition();
        isRecording = false;
        document.body.classList.remove("recording");
        status.innerText = "Коснитесь для записи";
      } else {
        startListening();
      }
    });

    toggleInput.addEventListener("click", () => {
      inputRow.classList.toggle("open");
      if (inputRow.classList.contains("open")) {
        manualText.focus();
        toggleInput.innerText = "Скрыть";
      } else {
        toggleInput.innerText = "Ввести вручную";
      }
    });

    sendBtn.addEventListener("click", () => {
      const val = manualText.value.trim();
      if (val) {
        sendTransaction(val);
        manualText.value = "";
        inputRow.classList.remove("open");
        toggleInput.innerText = "Ввести вручную";
      }
    });

    manualText.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    async function sendTransaction(text) {
      status.innerText = "Сохранение...";
      showToast("Записываем: " + text);

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { 
            "Content-Type": "text/plain;charset=utf-8" 
          },
          body: JSON.stringify({ text: text }),
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success") {
          const tx = data.transaction;
          const msg = `✓ ${tx.amount} ${tx.currency} — ${tx.category}`;

          sessionStorage.setItem("joymne_toast", msg);
          window.location.replace(window.location.pathname + "?t=" + Date.now());
        } else {
          showToast("Ошибка: " + (data.message || "Не удалось сохранить"));
          status.innerText = "Коснитесь для записи";
        }
      } catch (err) {
        showToast("Ошибка соединения");
        status.innerText = "Коснитесь для записи";
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }
  </script>
</body>
</html>
