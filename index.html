<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>joymne</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #0b0f19; 
      margin: 0; 
      padding: 20px; 
      color: #fff; 
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 400px; text-align: center; }
    
    .header-text { color: #8c9bae; font-size: 16px; margin-bottom: 25px; }

    /* Пирамидка кругов */
    .pyramid { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 25px; }
    .row { display: flex; gap: 20px; justify-content: center; width: 100%; }

    /* Стили круглых кнопок */
    .circle-btn {
      width: 90px; height: 90px; border-radius: 50%;
      background: #161b22; border: 3px solid #30363d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; color: #fff; font-weight: bold;
    }
    .circle-btn span { font-size: 11px; color: #8b949e; margin-top: 4px; font-weight: normal; }

    /* Цвета и подсветка неактивных/активных кругов */
    .circle-joy { border-color: rgba(242, 201, 76, 0.4); }
    .circle-joy.active { border-color: #f2c94c; background: rgba(242, 201, 76, 0.15); box-shadow: 0 0 20px rgba(242, 201, 76, 0.4); }

    .circle-debt { border-color: rgba(235, 87, 87, 0.4); }
    .circle-debt.active { border-color: #eb5757; background: rgba(235, 87, 87, 0.15); box-shadow: 0 0 20px rgba(235, 87, 87, 0.4); }

    .circle-transit { border-color: rgba(108, 117, 125, 0.4); }
    .circle-transit.active { border-color: #adb5bd; background: rgba(108, 117, 125, 0.2); box-shadow: 0 0 20px rgba(108, 117, 125, 0.4); }

    .circle-mila { border-color: rgba(187, 134, 252, 0.4); }
    .circle-mila.active { border-color: #bb86fc; background: rgba(187, 134, 252, 0.15); box-shadow: 0 0 20px rgba(187, 134, 252, 0.4); }

    .circle-bank { border-color: rgba(47, 128, 237, 0.4); }
    .circle-bank.active { border-color: #2f80ed; background: rgba(47, 128, 237, 0.15); box-shadow: 0 0 20px rgba(47, 128, 237, 0.4); }

    .circle-hands { border-color: rgba(39, 174, 96, 0.4); }
    .circle-hands.active { border-color: #27ae60; background: rgba(39, 174, 96, 0.15); box-shadow: 0 0 20px rgba(39, 174, 96, 0.4); }

    /* Зона ввода */
    .input-card { background: #161b22; padding: 20px; border-radius: 20px; border: 1px solid #30363d; }
    textarea { width: 100%; padding: 12px; border: 1px solid #30363d; background: #0d1117; color: #fff; border-radius: 12px; font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 15px; }
    textarea::placeholder { color: #484f58; }

    /* Интерфейс транзита (круглые селекторы без текста ИЗ/В) */
    #transitPanel { display: none; margin-bottom: 15px; }
    .transit-circles-row { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
    
    .transit-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: #0d1117; color: #fff; border: 3px solid #30363d;
      display: flex; align-items: center; justify-content: center;
    }
    .transit-circle select {
      background: transparent; color: #fff; border: none; font-size: 13px; font-weight: bold;
      width: 100%; text-align: center; text-align-last: center; outline: none; cursor: pointer;
    }
    .transit-circle select option { background: #161b22; color: #fff; }

    /* Цвета кружков транзита */
    .circle-from-box { border-color: #eb5757; box-shadow: 0 0 10px rgba(235, 87, 87, 0.3); }
    .circle-to-box { border-color: #2f80ed; box-shadow: 0 0 10px rgba(47, 128, 237, 0.3); }

    .transit-amount { width: 100%; padding: 12px; background: #0d1117; color: #fff; border: 1px solid #30363d; border-radius: 12px; font-size: 16px; text-align: center; box-sizing: border-box; }
    .transit-amount::placeholder { color: #484f58; }

    /* Кнопки сохранения */
    .actions { display: flex; gap: 10px; }
    button.submit-btn { flex: 2; background: #238636; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button.photo-btn { flex: 1; background: #30363d; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #21262d; color: #fff; padding: 10px 20px; border-radius: 20px; display: none; font-size: 14px; border: 1px solid #30363d; z-index: 1000; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-text">joymne</div>

  <!-- Пирамидка кругов -->
  <div class="pyramid">
    <!-- Вершина -->
    <div class="row">
      <div class="circle-btn circle-joy" onclick="selectCategory('Joy', this)">
        Joy
        <span id="balJoy">---</span>
      </div>
    </div>
    <!-- Второй ряд -->
    <div class="row">
      <div class="circle-btn circle-debt" onclick="selectCategory('Долги', this)">
        Долги
        <span id="balDebts">---</span>
      </div>
      <div class="circle-btn circle-transit" onclick="selectCategory('Транзит', this)">
        Транзит
        <span id="balTransit">---</span>
      </div>
    </div>
    <!-- Нижний ряд (Руки по умолчанию active) -->
    <div class="row">
      <div class="circle-btn circle-mila" onclick="selectCategory('Мила', this)">
        Мила
        <span id="balMila">---</span>
      </div>
      <div class="circle-btn circle-bank" onclick="selectCategory('Банк', this)">
        Банк
        <span id="balBank">---</span>
      </div>
      <div class="circle-btn circle-hands active" onclick="selectCategory('Руки', this)">
        Руки
        <span id="balHands">---</span>
      </div>
    </div>
  </div>

  <!-- Карточка ввода -->
  <div class="input-card">
    
    <!-- Стандартный ввод (для Мила, Банк, Руки, Долги, Joy) -->
    <div id="standardInput">
      <textarea id="txInput" rows="2" placeholder="Например: 8 хлеб или получил 50..."></textarea>
    </div>

    <!-- Специальный блок Транзита (кружки выбора без лишнего текста) -->
    <div id="transitPanel">
      <div class="transit-circles-row">
        <div class="transit-circle circle-from-box">
          <select id="walletFrom">
            <option value="Руки">Руки</option>
            <option value="Мила">Мила</option>
            <option value="Банк">Банк</option>
          </select>
        </div>
        <div style="font-size: 20px; color: #8b949e;">➔</div>
        <div class="transit-circle circle-to-box">
          <select id="walletTo">
            <option value="">Копилка</option>
            <option value="Мила">Мила</option>
            <option value="Банк">Банк</option>
            <option value="Руки">Руки</option>
          </select>
        </div>
      </div>
      <input type="text" id="transitAmount" class="transit-amount" placeholder="Сумма перевода (€)">
    </div>

    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display: none;" onchange="handlePhoto(this)">

    <div class="actions">
      <button class="submit-btn" onclick="submitTransaction()">Сохранить</button>
      <button class="photo-btn" id="photoBtn" onclick="document.getElementById('photoInput').click()">📷 Чек</button>
    </div>
  </div>
</div>

<div id="toast">Сохранение...</div>

<script>
  const APPS_SCRIPT_URL = "ВАШ_WEB_APP_URL_ЗДЕСЬ";
  
  let activeCategory = "Руки"; // По умолчанию Руки
  let isSubmitting = false;

  window.onload = function() {
    loadBalances();
    const savedMsg = sessionStorage.getItem("joymne_toast");
    if (savedMsg) {
      showToast(savedMsg);
      sessionStorage.removeItem("joymne_toast");
    }
  };

  function selectCategory(category, element) {
    activeCategory = category;
    document.querySelectorAll('.circle-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');

    const standardInput = document.getElementById("standardInput");
    const transitPanel = document.getElementById("transitPanel");
    const photoBtn = document.getElementById("photoBtn");

    if (category === "Транзит") {
      standardInput.style.display = "none";
      transitPanel.style.display = "block";
      photoBtn.style.display = "none";
    } else {
      standardInput.style.display = "block";
      transitPanel.style.display = "none";
      photoBtn.style.display = "block";
    }
  }

  async function loadBalances() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getBalances`);
      const data = await res.json();
      if (data.status === "success") {
        document.getElementById("balMila").innerText = (data.balances["Мила"] || 0).toFixed(2) + " €";
        document.getElementById("balBank").innerText = (data.balances["Банк"] || 0).toFixed(2) + " €";
        document.getElementById("balHands").innerText = (data.balances["Руки"] || 0).toFixed(2) + " €";
        document.getElementById("balDebts").innerText = (data.balances["Долги"] || 0).toFixed(2) + " €";
        document.getElementById("balTransit").innerText = (data.balances["Транзит"] || 0).toFixed(2) + " €";
      }
    } catch (e) {
      console.error("Не удалось загрузить балансы", e);
    }
  }

  async function submitTransaction(photoBase64 = null) {
    if (isSubmitting) return;

    let finalDescription = "";

    if (activeCategory === "Транзит") {
      const fromWallet = document.getElementById("walletFrom").value;
      const toWallet = document.getElementById("walletTo").value;
      const amountVal = document.getElementById("transitAmount").value.trim();

      if (!amountVal) {
        alert("Введите сумму перевода!");
        return;
      }

      if (toWallet) {
        finalDescription = `Перевод из ${fromWallet} в ${toWallet} ${amountVal}`;
      } else {
        finalDescription = `Перевод из ${fromWallet} в Копилка (Сбережения) ${amountVal}`;
      }
    } else {
      finalDescription = document.getElementById("txInput").value.trim();
      if (!finalDescription && !photoBase64) {
        alert("Введите описание или сумму!");
        return;
      }
    }

    isSubmitting = true;
    showToast("Отправка данных...");

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ category: activeCategory, text: finalDescription, photo: photoBase64 }),
        redirect: "follow"
      });

      const data = await response.json();
      if (data.status === "success") {
        sessionStorage.setItem("joymne_toast", "✓ Успешно сохранено!");
        window.location.replace(window.location.pathname + "?t=" + Date.now());
      } else {
        alert("Ошибка сервера: " + (data.message || "Неизвестная ошибка"));
        isSubmitting = false;
      }
    } catch (err) {
      alert("Ошибка соединения с таблицей");
      isSubmitting = false;
    }
  }

  function handlePhoto(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        submitTransaction(e.target.result);
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.innerText = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }
</script>

</body>
</html>
